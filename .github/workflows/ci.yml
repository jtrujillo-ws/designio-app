name: CI

on:
  pull_request:
  push:
    branches: [agents, dev, stg, main]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.11

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_APP: postgres://designio_app:designio_app_dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:seed
      # La suite de autorización provoca cientos de errores ESPERADOS (RLS, guards): son el
      # resultado que se afirma. Al terminar el job, el runner vuelca el log del contenedor de
      # Postgres —cada error con su sentencia entera—, y ese volcado sepulta la salida de vitest
      # miles de líneas más arriba: cuando la CI se pone roja, el fallo real no hay cómo leerlo.
      # El error sigue viajando al cliente con su DETAIL, y vitest lo imprime, así que callar el
      # log del SERVIDOR no pierde diagnóstico: lo devuelve.
      - name: Callar el log de errores del servidor (su volcado sepulta la salida de vitest)
        # Comodidad de diagnóstico, no requisito: si el runner no trae psql, la CI sigue.
        continue-on-error: true
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter system set log_min_messages = 'log'" \
            -c "select pg_reload_conf()"
      # Incluye la suite de autorización (RLS activo) contra el Postgres real del service.
      - run: bun run test

  client-bundle:
    name: Client bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Ningún módulo server-only puede alcanzar el bundle del navegador (defensa 3 de 3).
      - run: bun run check:bundle

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pendiente (follow-up): E2E smoke con Playwright contra el build de producción
  # (hidratación real en navegador real), cuando existan flujos de app que smokear.
